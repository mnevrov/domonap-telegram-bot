name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest -q

      - name: Audit runtime dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

      - name: Build Docker image
        run: docker build --tag domonap-telegram-bot:ci .

      - name: Verify Docker runtime
        run: |
          docker run --rm --entrypoint python domonap-telegram-bot:ci -c '
          import sys
          import domonap_bot.main
          import domonap_bot.backup_daemon
          assert sys.version_info[:2] == (3, 12), sys.version
          '

      - name: Validate Docker Compose
        run: |
          set -euo pipefail
          touch .env
          docker compose config > /tmp/compose-local.yml
          DOMONAP_BOT_IMAGE=ghcr.io/mnevrov/domonap-telegram-bot:v1.0.0 \
            docker compose -f docker-compose.prod.yml config > /tmp/compose-production.yml
          if grep -qE '^[[:space:]]+build:' /tmp/compose-production.yml; then
            echo '::error::Production Compose must not contain build directives'
            exit 1
          fi
          grep -q 'ghcr.io/mnevrov/domonap-telegram-bot:v1.0.0' /tmp/compose-production.yml
