name: Domonap Live Canary

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/domonap/**"
      - "src/domonap_bot/domonap/**"
      - "src/domonap_bot/tools/api_probe.py"
      - ".github/workflows/domonap-live-canary.yml"

permissions:
  contents: read
  issues: write

jobs:
  live-canary:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Run non-mutating API probes
        id: probe
        continue-on-error: true
        env:
          DOMONAP_CANARY_ACCESS_TOKEN: ${{ secrets.DOMONAP_CANARY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m domonap_bot.tools.api_probe \
            --output /tmp/domonap-live-canary.json

      - name: Read canary result
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/domonap-live-canary.json ]]; then
            echo "overall=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/domonap-live-canary.json").read_text())
          print(f"overall={report['overall']}")
          PY

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: domonap-live-canary
          path: /tmp/domonap-live-canary.json
          if-no-files-found: ignore
          retention-days: 14

      # No suitable long-lived canary credential is currently available. Keep this
      # explicit in the run, but do not turn an unconfigured optional control into a
      # false production failure. Once the secret exists, degradation is blocking.
      - name: Report unconfigured canary
        if: steps.result.outputs.overall == 'skipped'
        run: |
          echo "DOMONAP_CANARY_ACCESS_TOKEN is not configured; live compatibility is not verified."
          echo "This is intentionally non-blocking until a canary credential is available."

      - name: Open or update degraded-canary issue
        if: >-
          steps.result.outputs.overall == 'degraded' ||
          steps.result.outputs.overall == 'failed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OVERALL: ${{ steps.result.outputs.overall }}
        run: |
          set -euo pipefail
          title="[api-canary] Domonap live compatibility degraded"
          existing="$(gh issue list \
            --state open \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')"
          {
            echo "# Domonap live canary: ${OVERALL}"
            echo
            if [[ -f /tmp/domonap-live-canary.json ]]; then
              echo '```json'
              cat /tmp/domonap-live-canary.json
              echo '```'
            else
              echo "The probe failed before producing a report."
            fi
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "The canary performs only read-only user/keys/call-log/SignalR negotiate requests."
          } > /tmp/canary-issue.md
          if [[ -z "$existing" ]]; then
            gh issue create --title "$title" --body-file /tmp/canary-issue.md
          else
            gh issue edit "$existing" --body-file /tmp/canary-issue.md
          fi

      - name: Close resolved degraded-canary issue
        if: steps.result.outputs.overall == 'compatible'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[api-canary] Domonap live compatibility degraded"
          existing="$(gh issue list \
            --state open \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" \
              --comment "Resolved automatically: the latest read-only live canary is compatible."
          fi

      - name: Fail on active canary degradation
        if: >-
          steps.result.outputs.overall == 'degraded' ||
          steps.result.outputs.overall == 'failed'
        run: exit 1
