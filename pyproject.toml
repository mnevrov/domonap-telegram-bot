[project]
name = "domonap-telegram-bot"
version = "1.0.0"
description = "Telegram bot for Domonap intercom control"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.12.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
    "cryptography>=50.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy._Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
disable_error_code = [
    "untyped-decorator",
    "import-untyped",
    "import-not-found",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
